<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <!-- Google Fonts para replicar la tipografía limpia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/img/iconoG4.ico">
    <title>G4 Dijkstra</title>
    <style>
        :root {
            --bg-color-start: #f4f7fa;
            --bg-color-end: #e6eef5;
            
            --panel-bg: rgba(255, 255, 255, 0.6);
            --panel-border: rgba(255, 255, 255, 0.8);
            
            --sombra-primario: rgba(90, 139, 176, 0.25);

            --text-main: #1a2b3c;
            --text-muted: #5a6e82;
            --text-tiny: #8395a7;
            
            --input-bg: #f3f6f9;
            --input-border: #c4d4e3;

            --gradiente-fin: #8aaae5; 
            --gradiente-inicio: #5abeb4;
            
            --btn-primary-bg: #d9e3f0;
            --btn-primary-border: #b1c6de;
            --btn-primary-text: #2c4a6b;
            --btn-secondary-bg: #dcdede;
            --btn-secondary-border: #bdc3c7;
            --btn-secondary-text: #4a5568;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif; /* Fuente similar a la de la imagen */
            background: linear-gradient(135deg, var(--bg-color-start) 0%, var(--bg-color-end) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #network-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .logo-container {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            font-size: 22px;
            font-weight: 400;
        }
        
        .header-logo {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gradiente-inicio), var(--gradiente-fin));
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
            font-size: 20px;
            box-shadow: 0 4px 14px var(--sombra-primario);
        }

        .glass-panel {
            position: relative;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
            padding: 50px 60px; /* Padding reducido para hacerlo más compacto */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 580px; /* Ancho reducido de 750px a 580px */
            max-width: 95vw;
        }

        h1 {
            color: var(--text-main);
            font-size: 40px; /* Tamaño ligeramente ajustado para encajar en el panel más pequeño */
            font-weight: 300; 
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-main);
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 40px;
            width: 320px; /* Ancho fijo para el input */
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 18px;
            color: var(--text-muted);
            outline: none;
            transition: border-color 0.3s ease;
            appearance: textfield; /* Ocultar flechas por defecto en algunos navegadores */
        }

        /* Customizing the number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1; /* Make arrows visible like in the image */
        }

        input[type="number"]:focus {
            border-color: #8da9c4;
            background-color: #fff;
        }

        .input-hint {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-tiny);
            margin-left: 2px;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }

        button {
            padding: 12px 0;
            width: 140px; /* Ancho fijo para botones idénticos */
            border-radius: 30px; /* Forma de píldora */
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            border: 1px solid var(--btn-primary-border);
        }

        .btn-primary:hover {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1px solid var(--btn-secondary-border);
        }

        .btn-secondary:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="header-logo">
                <i class="fa-solid fa-diagram-project"></i>
            </div>
        G4
    </div>

    <canvas id="network-canvas"></canvas>

    <div class="glass-panel">
        <h1>BIENVENIDOS A G4</h1>
        <p class="subtitle">Inicie su proyecto de red de grafos.</p>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="number" id="nodeCount" min="7" max="16" value="7">
            </div>
            <div class="input-hint">Número de Nodos (7 - 16)</div>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="irAlPrograma('generar')">GENERAR</button>
            <button class="btn-secondary" onclick="irAlPrograma('manual')">MANUAL</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const connectionDistance = 250; // Distancia para conectar ajustada

        // Colores extraídos de la imagen, con opacidades similares
        const colors = [
            { fill: 'rgba(102, 204, 187, 0.45)', stroke: 'rgba(80, 180, 160, 0.7)' }, // Verde/Turquesa
            { fill: 'rgba(128, 182, 224, 0.45)', stroke: 'rgba(100, 150, 200, 0.7)' }, // Azul medio
            { fill: 'rgba(153, 204, 238, 0.35)', stroke: 'rgba(130, 180, 220, 0.6)' }  // Celeste claro
        ];

        function init() {
            resize();
            window.addEventListener('resize', resize);
            createParticles();
            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createParticles(); 
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.4; // Velocidad lenta
                this.vy = (Math.random() - 0.5) * 0.4;
                
                // Nodos más grandes como se solicitó
                // Generamos variedad: algunos muy grandes, otros medianos
                const sizeType = Math.random();
                if (sizeType > 0.85) {
                    this.radius = Math.random() * 25 + 25; // Muy grandes (25 a 50)
                } else if (sizeType > 0.4) {
                    this.radius = Math.random() * 15 + 15; // Medianos (15 a 30)
                } else {
                    this.radius = Math.random() * 8 + 8;   // Pequeños (8 a 16)
                }
                
                const colorStyle = colors[Math.floor(Math.random() * colors.length)];
                this.fillColor = colorStyle.fill;
                this.strokeColor = colorStyle.stroke;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Rebote en bordes con un poco de margen para que no desaparezcan de golpe
                if (this.x < -this.radius || this.x > width + this.radius) this.vx *= -1;
                if (this.y < -this.radius || this.y > height + this.radius) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.fillColor;
                ctx.fill();
                
                ctx.lineWidth = 1.5; // Borde un poco más notorio
                ctx.strokeStyle = this.strokeColor;
                ctx.stroke();
            }
        }

        function createParticles() {
            particles = []; 
            // generamos mucha más cantidad de nodos.
            const particleCount = 70; 
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            // Limpiar canvas pero dejando un rastro sutil (opcional, aquí lo hacemos limpio)
            ctx.clearRect(0, 0, width, height);

            // Dibujar líneas primero (por debajo de los nodos)
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        
                        // Líneas muy tenues y azuladas
                        const opacity = 0.3 * (1 - (distance / connectionDistance));
                        ctx.strokeStyle = `rgba(130, 160, 190, ${opacity})`; 
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            // Dibujar nodos encima
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
        }
        function irAlPrograma(modo) {
            // Obtenemos el número que el usuario puso en el input
            const cantidadNodos = document.getElementById('nodeCount').value;
            // Redirigimos a programa.html enviando el modo y la cantidad por la URL
            window.location.href = `programa.html?modo=${modo}&nodos=${cantidadNodos}`;
        }
        // Iniciar al cargar
        window.onload = init;
    </script>
</body>
</html>
